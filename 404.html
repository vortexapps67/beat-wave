<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in the Static | BeatWave</title>

    <link rel="icon" type="image/png" href="beatwave%20new%20new.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css?v=4">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-mid);
            line-height: 1.6;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        /* ── Ambient background ── */
        .bw-aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(60% 50% at 20% 30%, rgba(124, 92, 255, 0.22), transparent 60%),
                radial-gradient(50% 45% at 80% 70%, rgba(0, 229, 242, 0.14), transparent 60%),
                radial-gradient(40% 40% at 50% 50%, rgba(255, 59, 59, 0.08), transparent 70%);
            filter: blur(40px);
            animation: aurora 18s ease-in-out infinite alternate;
        }
        body.light-theme .bw-aurora {
            background:
                radial-gradient(60% 50% at 20% 30%, rgba(109, 77, 251, 0.12), transparent 60%),
                radial-gradient(50% 45% at 80% 70%, rgba(0, 180, 195, 0.10), transparent 60%);
            filter: blur(50px);
        }
        @keyframes aurora {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(-2%, 1%, 0) scale(1.05); }
            100% { transform: translate3d(2%, -1%, 0) scale(1.02); }
        }

        .bw-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, var(--line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 85%);
            opacity: 0.5;
        }

        /* ── Card ── */
        .error-card {
            position: relative;
            z-index: 10;
            width: min(92vw, 520px);
            padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 48px);
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--r-xl, 24px);
            box-shadow: var(--shadow-lg), var(--inset-hair);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            animation: cardIn 0.8s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1)) both;
        }
        body.light-theme .error-card { background: var(--bg-glass); }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: block;
            filter: drop-shadow(0 0 22px rgba(124, 92, 255, 0.4));
            transition: transform 0.4s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
        }
        .logo:hover { transform: scale(1.06) rotate(-4deg); }
        body.light-theme .logo { filter: invert(1) drop-shadow(0 0 22px rgba(109, 77, 251, 0.28)); }

        .error-code {
            font-family: var(--mono);
            font-size: clamp(5rem, 18vw, 8.5rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.06em;
            background: var(--grad-brand);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        h1 {
            font-family: var(--font-display, 'Instrument Serif', serif);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 400;
            color: var(--text-hi);
            letter-spacing: var(--tr-head, -0.01em);
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-mid);
            margin-bottom: 32px;
            max-width: 36ch;
            margin-inline: auto;
        }

        /* ── Buttons ── */
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-family: var(--mono);
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 13px 24px;
            border-radius: 999px;
            transition: transform 0.25s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1)),
                        background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn:active { transform: translateY(0) scale(0.98); }

        .btn-primary {
            background: var(--grad-brand);
            color: #fff;
            box-shadow: var(--shadow-accent);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 46px -14px rgba(124, 92, 255, 0.8);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-hi);
            border: 1px solid var(--line);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            background: var(--bg-card-hover);
            border-color: var(--accent-line, var(--line-hi));
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            color: var(--text-hi);
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.25s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1)), background 0.25s ease;
        }
        .theme-toggle:hover { transform: translateY(-2px); background: var(--bg-card-hover); }
        .theme-toggle i { font-size: 0.95rem; }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .bw-aurora { animation: none; }
            .error-card { animation: none; }
            .btn, .logo, .theme-toggle { transition: none; }
        }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            .error-card { padding: 28px 20px; }
            .btn { width: 100%; justify-content: center; }
            .btn-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="bw-aurora" aria-hidden="true"></div>
    <div class="bw-grid" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <main class="error-card">
        <a href="index.html" aria-label="BeatWave home">
            <img src="beatwave%20new%20new.png" alt="BeatWave" class="logo">
        </a>
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Lost in the static</h1>
        <p>This track doesn't exist or has been removed from the playlist queue.</p>

        <div class="btn-container">
            <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Return Home</a>
            <a href="web.html" class="btn btn-secondary"><i class="fas fa-play"></i> Web Player</a>
        </div>
    </main>

    <script>
        (function () {
            const root = document.documentElement;
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            const toggle = document.getElementById('themeToggle');

            function isLight() {
                return body.classList.contains('light-theme') || root.classList.contains('light-theme');
            }
            function applyTheme(light) {
                if (light) { root.classList.add('light-theme'); body.classList.add('light-theme'); }
                else { root.classList.remove('light-theme'); body.classList.remove('light-theme'); }
                root.style.colorScheme = light ? 'light' : 'dark';
                if (icon) icon.className = light ? 'fas fa-sun' : 'fas fa-moon';
            }

            // Read saved / system preference
            let saved = null;
            try { saved = localStorage.getItem('beatwave-theme'); } catch (e) {}
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            applyTheme(saved ? saved === 'light' : prefersLight);

            if (toggle) {
                toggle.addEventListener('click', () => {
                    const next = !isLight();
                    try { localStorage.setItem('beatwave-theme', next ? 'light' : 'dark'); } catch (e) {}
                    // Ripple if supported
                    if (typeof document.startViewTransition === 'function' &&
                        !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
                        const x = toggle.getBoundingClientRect().left + toggle.offsetWidth / 2;
                        const y = toggle.getBoundingClientRect().top + toggle.offsetHeight / 2;
                        root.classList.add('theme-ripple');
                        const t = document.startViewTransition(() => applyTheme(next));
                        const cleanup = () => root.classList.remove('theme-ripple');
                        t.ready.then(() => {
                            const maxR = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
                            root.animate(
                                [{ clipPath: `circle(0px at ${x}px ${y}px)` },
                                 { clipPath: `circle(${maxR}px at ${x}px ${y}px)` }],
                                { duration: 850, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'forwards', pseudoElement: '::view-transition-new(root)' }
                            );
                        }).catch(() => {}).then(() => t.finished.catch(() => {})).then(cleanup, cleanup);
                    } else {
                        applyTheme(next);
                    }
                });
            }
        })();
    </script>
</body>
</html>
